<!--
  RubricLensAi — favicon แบบหุ่นยนต์ (ไอคอนบนแท็บเบราว์เซอร์)

  ต่างจากโลโก้เต็มมาก เพราะต้องอ่านออกที่ 16 พิกเซล:
  - เหลือแค่ "หน้าหุ่น" อย่างเดียว ตัดตัว แขน และแว่นออกทั้งหมด
  - ใช้รูปทึบ ไม่ใช่เส้น เพราะเส้นบางจะหายตอนย่อ
  - มีพื้นหลังสี่เหลี่ยมสีแบรนด์ เพราะแท็บเบราว์เซอร์มีทั้งพื้นขาวและพื้นดำ

  เคยลองใส่ตัวหุ่นลงไปด้วยแล้ว ปรากฏว่าที่ 16 พิกเซล หัวกับตัวเชื่อมติดกัน
  กลายเป็นก้อนขาวอ่านไม่ออก จึงตัดออก

  สีฝังตายตัว #286096 = ค่าของตัวแปร rl-brand-600
  ถ้าเปลี่ยนสีแบรนด์ ต้องมาแก้ที่นี่ด้วยมือ
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" role="img" aria-label="RubricLensAi">
  <title>RubricLensAi</title>
  <rect width="32" height="32" rx="7" fill="#286096"/>
  <rect x="4.5" y="7" width="23" height="18" rx="6" fill="#ffffff"/>
  <circle cx="11.4" cy="16" r="3.1" fill="#286096"/>
  <circle cx="20.6" cy="16" r="3.1" fill="#286096"/>
</svg>
