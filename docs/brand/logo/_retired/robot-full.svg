<!--
  RubricLensAi — โลโก้หุ่นยนต์ (แบบเต็มตัว)

  แนวคิด: หุ่นยนต์ = ผู้ช่วย AI  ถือแว่นขยายที่มีเกณฑ์อยู่ข้างใน = การตรวจตามเกณฑ์
  รวมทั้งคำว่า Rubric (เส้นในเลนส์) และ Lens (ตัวแว่น) ไว้ในภาพเดียว

  ⚠️ งานออกแบบต้นฉบับ ไม่ได้ลอกจากหุ่นยนต์ยี่ห้อใด
     รูปทรงทั้งหมดสร้างจากวงกลม สี่เหลี่ยมมน และเส้นตรงพื้นฐาน

  ใช้ currentColor ทั้งหมด → เปลี่ยนสีตามตัวอักษรรอบๆ อัตโนมัติ

  ⚠️ ห้ามใช้ไฟล์นี้ต่ำกว่า 40 พิกเซล — ตากับเส้นในเลนส์จะเละติดกัน
     ขนาดเล็กกว่านั้นให้ใช้ robot-mark.svg (หัวอย่างเดียว) หรือ favicon.svg
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="12 2 84 80" width="84" height="80" fill="none" role="img" aria-label="RubricLensAi">
  <title>RubricLensAi</title>
  <g stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.6">
    <!-- แขน: วาดก่อนตัว เพื่อให้ตัวทับโคนแขนไว้ ดูเหมือนแขนงอกออกจากไหล่ -->
    <path d="M27.5 56 L17 64" stroke-width="4.6"/>
    <path d="M56 57 L73.5 42.5" stroke-width="4.6"/>

    <!-- ตัว: ทรงระฆังผายออกด้านล่าง = ตั้งมั่น ไม่ล้ม -->
    <path d="M42 46 C33 46 26.5 52.5 25.5 65 C25 72.5 28.5 78 35 78 H49 C55.5 78 59 72.5 58.5 65 C57.5 52.5 51 46 42 46 Z"/>

    <!-- คอ -->
    <path d="M42 41.5 V46"/>

    <!-- หัว: จอสี่เหลี่ยมมน -->
    <rect x="20" y="6" width="44" height="35.5" rx="11"/>

    <!-- แว่นขยาย -->
    <circle cx="83" cy="32" r="9.5"/>
    <!-- เกณฑ์ 3 ข้อ ยาวไม่เท่ากัน = ให้คะแนนเป็นระดับ ไม่ใช่ผ่าน/ไม่ผ่าน -->
    <path d="M78.7 28.2 H88"   stroke-width="2.2"/>
    <path d="M78.7 32   H83.5" stroke-width="2.2"/>
    <path d="M78.7 35.8 H86"   stroke-width="2.2"/>
  </g>

  <!-- ตา: วงกลมทึบเรียบๆ ไม่มีคิ้ว ไม่มีปาก
       จงใจไม่ใส่การ์ตูนมากกว่านี้ เพื่อไม่ให้ขัดกับบุคลิก "น่าเชื่อถือ เป็นกลาง" -->
  <circle cx="33" cy="24" r="4.2" fill="currentColor"/>
  <circle cx="51" cy="24" r="4.2" fill="currentColor"/>
</svg>
