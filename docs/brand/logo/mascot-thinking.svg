  <circle cx="81" cy="62" r="10" fill="#3f9a9a" opacity="0.35"/>
  <circle cx="129" cy="62" r="10" fill="#3f9a9a" opacity="0.35"/>
  <circle cx="81" cy="62" r="9" fill="url(#eye)"/>
  <circle cx="129" cy="62" r="9" fill="url(#eye)"/>
