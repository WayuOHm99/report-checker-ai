<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>RubricLensAi — ภาพแชร์ลิงก์ 1200x630</title>

<!-- ข้อมูลบอกขนาดผืนผ้าใบให้ตัวแปลงไฟล์ของ Adobe Express -->
<meta name="hz:slide-selector" content=".banner">
<meta name="hz:canvas-width" content="1200">
<meta name="hz:canvas-height" content="630">

<style>

@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;700&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }
body { display: flex; justify-content: center; align-items: center; background: #eceff3; }
.banner { position: relative; width: 1200px; height: 630px; background: #ffffff; overflow: hidden; }
.halo { position: absolute; left: 714px; top: 86px; width: 428px; height: 428px; border-radius: 50%; background: #eef3f9; }
.mascot { position: absolute; left: 780px; top: 128px; width: 336px; height: 345px; }
.bar { position: absolute; left: 88px; top: 170px; width: 10px; height: 34px; border-radius: 5px; background: #3e7d70; }
.eyebrow { position: absolute; left: 114px; top: 174px; font-family: 'Noto Sans Thai', sans-serif; font-weight: 700; font-size: 25px; line-height: 1.3; color: #3e7d70; }
.wordmark { position: absolute; left: 88px; top: 226px; font-family: 'Noto Sans Thai', sans-serif; font-weight: 700; font-size: 82px; line-height: 1.1; letter-spacing: -1.5px; color: #286096; }
.headline { position: absolute; left: 88px; top: 334px; font-family: 'Noto Sans Thai', sans-serif; font-weight: 700; font-size: 42px; line-height: 1.35; color: #141619; }
.subcopy { position: absolute; left: 88px; top: 398px; font-family: 'Noto Sans Thai', sans-serif; font-weight: 400; font-size: 26px; line-height: 1.6; color: #595e64; }
.url { position: absolute; left: 88px; top: 522px; font-family: 'Noto Sans Thai', sans-serif; font-weight: 400; font-size: 24px; line-height: 1.4; color: #6f757b; }
.rule { position: absolute; left: 0; top: 618px; width: 1200px; height: 12px; background: #286096; }
</style>
</head>
<body>
<div class="banner" data-canvas-width="1200" data-canvas-height="630">
  <div class="halo"></div>

    <rect x="53" y="36" width="104" height="70" rx="24" stroke="#0a1d31" stroke-width="2" opacity="0.55"/>

    <circle cx="129" cy="68" r="12" fill="url(#eye)"/>

  <div class="wordmark">RubricLensAi</div>

  <div class="subcopy">รายงานทั่วไป · โครงงาน · รายงานวิจัย<br>ได้คะแนนถ่วงน้ำหนักพร้อมเหตุผลและหลักฐานทุกข้อ</div>
