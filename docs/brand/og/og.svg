<!--
  RubricLensAi — ภาพ Open Graph (ภาพที่โผล่ตอนแชร์ลิงก์ใน LINE / Facebook / X)
  ขนาดมาตรฐาน 1200 x 630

  ไฟล์นี้เป็นต้นฉบับ ใช้สร้าง og.png ด้วยคำสั่ง:
      python docs/brand/og/render-og.py

  ⚠️ ชุดสีไล่เฉด (defs) กับก้อน <g id="mascot"> คัดลอกมาจาก logo/mascot.svg ทั้งดุ้น
     ถ้าแก้มาสคอต (ผ่าน logo/build-mascots.py) ต้องคัดลอกมาทับที่นี่ใหม่ด้วย
     ไม่งั้นภาพแชร์ลิงก์จะเป็นหุ่นเวอร์ชันเก่าโดยไม่มีอะไรเตือน

  ⚠️ ชุด defs ต้องอยู่ที่ระดับรากของไฟล์เท่านั้น ห้ามย้ายเข้าไปไว้ใน <g>
     ถ้าอยู่ใน <g> ที่ถูกย่อ/ขยาย โปรแกรมวาดภาพจะหาสีไล่เฉดไม่เจอ
     แล้วเปลี่ยนเป็นสีทึบแบบเงียบๆ (เคยเกิดมาแล้ว เลนส์แว่นกลายเป็นสีน้ำเงินทึบ)

  สีข้อความต้องตรงกับ tokens.css เสมอ:
    #286096 = rl-brand-600   #141619 = rl-text
    #595e64 = rl-text-muted  #6f757b = rl-text-faint   #3e7d70 = rl-accent-700
-->
<!--
  ⚠️ ห้ามลบ fill="none" ที่ <svg> ข้างล่าง
     รูปมาสคอตมีเส้นจำนวนมากที่ตั้งใจให้ "มีแต่เส้น ไม่มีสีพื้น"
     ถ้าไม่มี fill="none" เส้นพวกนั้นจะถูกเติมสีดำทึบตามค่าเริ่มต้นของ SVG
     ผลคือเลนส์แว่นกลายเป็นวงกลมดำ และขอบหัวมีลิ่มดำโผล่มา (เคยเกิดมาแล้วจริง)
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="RLNotoThai" fill="none">
  <title>RubricLensAi — ตรวจเอกสารให้ครบ ชัด และตรงเกณฑ์</title>

  <defs>
  <linearGradient id="shell" x1="0.15" y1="0" x2="0.85" y2="1">
  <stop offset="0" stop-color="#fbfdff"/>
  <stop offset="0.45" stop-color="#e6eef9"/>
  <stop offset="1" stop-color="#c5d8ef"/>
  </linearGradient>
  <linearGradient id="shellBody" x1="0.15" y1="0" x2="0.85" y2="1">
  <stop offset="0" stop-color="#f2f7fd"/>
  <stop offset="0.5" stop-color="#dbe7f6"/>
  <stop offset="1" stop-color="#b9cfe9"/>
  </linearGradient>
  <linearGradient id="shellArm" x1="0" y1="0" x2="0.6" y2="1">
  <stop offset="0" stop-color="#dbe7f6"/>
  <stop offset="1" stop-color="#a3bfe0"/>
  </linearGradient>
  <radialGradient id="screen" cx="0.38" cy="0.32" r="0.85">
  <stop offset="0" stop-color="#24507c"/>
  <stop offset="0.55" stop-color="#153a5e"/>
  <stop offset="1" stop-color="#0b2138"/>
  </radialGradient>
  <radialGradient id="screenOff" cx="0.38" cy="0.32" r="0.85">
  <stop offset="0" stop-color="#2c4c68"/>
  <stop offset="0.55" stop-color="#213b52"/>
  <stop offset="1" stop-color="#16293a"/>
  </radialGradient>
  <linearGradient id="glare" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
  <stop offset="0.42" stop-color="#ffffff" stop-opacity="0.05"/>
  <stop offset="0.7" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="eye" cx="0.35" cy="0.3" r="0.8">
  <stop offset="0" stop-color="#8fdcd6"/>
  <stop offset="0.6" stop-color="#5db5b5"/>
  <stop offset="1" stop-color="#349090"/>
  </radialGradient>
  <linearGradient id="ring" x1="0.2" y1="0" x2="0.8" y2="1">
  <stop offset="0" stop-color="#407bb5"/>
  <stop offset="0.5" stop-color="#286096"/>
  <stop offset="1" stop-color="#153c62"/>
  </linearGradient>
  <linearGradient id="ringOff" x1="0.2" y1="0" x2="0.8" y2="1">
  <stop offset="0" stop-color="#8aa4bd"/>
  <stop offset="1" stop-color="#5a7a99"/>
  </linearGradient>
  <linearGradient id="glass" x1="0.15" y1="0.1" x2="0.85" y2="0.9">
  <stop offset="0" stop-color="#ffffff"/>
  <stop offset="0.55" stop-color="#f4f9ff"/>
  <stop offset="1" stop-color="#dceaf9"/>
  </linearGradient>
  <radialGradient id="groundShadow" cx="0.5" cy="0.5" r="0.5">
  <stop offset="0" stop-color="#8fa3b8" stop-opacity="0.42"/>
  <stop offset="0.6" stop-color="#8fa3b8" stop-opacity="0.16"/>
  <stop offset="1" stop-color="#8fa3b8" stop-opacity="0"/>
  </radialGradient>
  <clipPath id="clipScreen"><rect x="53" y="36" width="104" height="70" rx="24"/></clipPath>
  <clipPath id="clipChest"><rect x="83" y="150" width="44" height="36" rx="9"/></clipPath>
  <clipPath id="clipGlass"><circle cx="210" cy="66" r="25"/></clipPath>
  </defs>

  <rect width="1200" height="630" fill="#ffffff"/>

  <!-- วงกลมอ่อนหลังหุ่น: แยกฝั่งภาพออกจากฝั่งข้อความโดยไม่ต้องขีดเส้น -->
  <circle cx="928" cy="300" r="214" fill="#eef3f9"/>

  <!-- มาสคอต: ระบบพิกัดเดิมคือ viewBox "30 14 224 230"
       ขยาย 1.5 เท่า แล้วเลื่อนให้กึ่งกลางตรงกับกึ่งกลางวงกลมอ่อน (928, 300) -->
  <g id="mascot" transform="translate(715, 100) scale(1.5)">
    <ellipse cx="105" cy="226" rx="72" ry="15" fill="url(#groundShadow)"/>
      <g stroke="url(#shellArm)" stroke-width="17" stroke-linecap="round">
        <path d="M72 146 L48 166"/>
        <path d="M138 143 L170 115"/>
      </g>
      <circle cx="47" cy="167" r="11.5" fill="url(#shellArm)"/>
      <circle cx="171" cy="114" r="11.5" fill="url(#shellArm)"/>
      <path d="M105 124 C81 124 69 141 66 176 C64 197 73 210 91 210 H119 C137 210 146 197 144 176 C141 141 129 124 105 124 Z" fill="url(#shellBody)"/>
      <path d="M105 124 C88 124 77 132 71 148 C82 155 93 158 105 158 C117 158 128 155 139 148 C133 132 122 124 105 124 Z" fill="#a9c3e2" opacity="0.20"/>
      <path d="M84 133 C76 142 72 156 70 173" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.45"/>
      <rect x="97" y="110" width="16" height="16" rx="5" fill="#b9cfe9"/>
      <rect x="39" y="22" width="132" height="98" rx="32" fill="url(#shell)"/>
      <path d="M44 56 A 27 27 0 0 1 71 27" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" opacity="0.8"/>
      <path d="M166 86 A 27 27 0 0 1 139 115" stroke="#9db8db" stroke-width="4.5" stroke-linecap="round" opacity="0.4"/>
      <rect x="53" y="36" width="104" height="70" rx="24" fill="url(#screen)"/>
      <g clip-path="url(#clipScreen)"><rect x="53" y="36" width="104" height="70" fill="url(#glare)"/></g>
      <rect x="53" y="36" width="104" height="70" rx="24" stroke="#0a1d31" stroke-width="2" opacity="0.55"/>
      <circle cx="81" cy="68" r="13" fill="#3f9a9a" opacity="0.35"/>
      <circle cx="129" cy="68" r="13" fill="#3f9a9a" opacity="0.35"/>
      <circle cx="81" cy="68" r="12" fill="url(#eye)"/>
      <circle cx="129" cy="68" r="12" fill="url(#eye)"/>
      <circle cx="77.0" cy="63.6" r="4.0" fill="#eafcfb"/>
      <circle cx="125.0" cy="63.6" r="4.0" fill="#eafcfb"/>
      <circle cx="85.0" cy="73.0" r="2.0" fill="#eafcfb" opacity="0.55"/>
      <circle cx="133.0" cy="73.0" r="2.0" fill="#eafcfb" opacity="0.55"/>
      <rect x="83" y="150" width="44" height="36" rx="9" fill="url(#screen)"/>
      <g clip-path="url(#clipChest)"><rect x="83" y="150" width="44" height="36" fill="url(#glare)"/></g>
      <rect x="83" y="150" width="44" height="36" rx="9" stroke="#0a1d31" stroke-width="1.6" opacity="0.5"/>
      <g stroke-width="3.6" stroke-linecap="round">
        <path d="M90 160 H120" stroke="#5db5b5"/>
        <path d="M90 168 H110" stroke="#5db5b5"/>
        <path d="M90 176 H116" stroke="#5db5b5"/>
      </g>
      <path d="M176 110 L192 94" stroke="#153c62" stroke-width="10" stroke-linecap="round"/>
      <path d="M177 107 L190 93" stroke="#4a7fb5" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
      <circle cx="210" cy="66" r="25" fill="url(#glass)"/>
      <g clip-path="url(#clipGlass)"><path d="M182 40 L214 40 L192 92 L182 92 Z" fill="#ffffff" opacity="0.75"/></g>
      <circle cx="210" cy="66" r="30" stroke="url(#ring)" stroke-width="10"/>
      <path d="M192 50 A 26 26 0 0 1 208 41" stroke="#8fb8dd" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
      <g stroke="#286096" stroke-width="5" stroke-linecap="round">
        <path d="M194 56 H226"/>
        <path d="M194 66 H214"/>
        <path d="M194 76 H222"/>
      </g>
  </g>

  <!-- ป้ายกำกับบนสุด -->
  <g transform="translate(88, 196)">
    <rect x="0" y="-26" width="10" height="34" rx="5" fill="#3e7d70"/>
    <text x="26" y="0" font-size="25" font-weight="700" fill="#3e7d70">ผู้ช่วยตรวจเอกสารตามเกณฑ์ที่คุณกำหนดเอง</text>
  </g>

  <text x="88" y="300" font-size="82" font-weight="700" fill="#286096" letter-spacing="-1.5">RubricLensAi</text>
  <text x="88" y="372" font-size="42" font-weight="700" fill="#141619">ตรวจเอกสารให้ครบ ชัด และตรงเกณฑ์</text>
  <text x="88" y="424" font-size="26" fill="#595e64">รายงานทั่วไป · โครงงาน · รายงานวิจัย</text>
  <text x="88" y="464" font-size="26" fill="#595e64">ได้คะแนนถ่วงน้ำหนักพร้อมเหตุผลและหลักฐานทุกข้อ</text>
  <text x="88" y="546" font-size="24" fill="#6f757b">rubriclensai.pages.dev</text>

  <rect x="0" y="618" width="1200" height="12" fill="#286096"/>
</svg>
