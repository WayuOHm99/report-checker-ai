name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Lint, unit, worker, audit, build and production-preview E2E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        # Kept in step with the engines.node range in package.json.
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Worker type and bundle check
        run: npm run worker:check

      - name: Production dependency audit
        run: npm run audit:prod

      - name: Production build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Production-preview E2E tests
        # `test:e2e:only` reuses the artefact built above; playwright.config.ts
        # serves it with `vite preview` and never reuses a server in CI.
        run: npm run test:e2e:only

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
