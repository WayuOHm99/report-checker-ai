<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#f8fafc" />
    <title>ไม่พบหน้านี้ | RubricLensAi</title>
    <!--
      หน้านี้เป็น HTML ล้วนโดยตั้งใจ วางไว้ใน public/ จึงถูกคัดลอกไป dist/404.html ตรง ๆ
      Cloudflare Pages หยิบไฟล์ชื่อนี้มาเสิร์ฟเองเมื่อไม่พบเส้นทางที่ขอ
      ไม่ผูกกับ React หรือ CSS ของแอป เพื่อให้หน้ายังแสดงได้แม้ bundle หลักมีปัญหา
      สไตล์เป็น inline ตามที่ CSP ใน public/_headers อนุญาต (style-src 'self' 'unsafe-inline')
    -->
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: #f8fafc;
        color: #020617;
        font-family: 'Noto Sans Thai', system-ui, -apple-system, 'Segoe UI', sans-serif;
        line-height: 1.75;
      }
      main { max-width: 32rem; }
      p.code { margin: 0; font-size: 0.875rem; font-weight: 600; color: #4f46e5; letter-spacing: 0.08em; }
      h1 { margin: 0.5rem 0 0; font-size: 1.75rem; line-height: 1.4; }
      p.lead { margin: 0.75rem 0 0; color: #475569; }
      nav { margin-top: 1.75rem; display: flex; flex-wrap: wrap; gap: 0.75rem; }
      a.button {
        display: inline-block;
        padding: 0.6rem 1.1rem;
        border-radius: 0.6rem;
        background: #4f46e5;
        color: #fff;
        text-decoration: none;
        font-weight: 600;
      }
      a.secondary { background: #fff; color: #1e293b; border: 1px solid #cbd5e1; }
      a:focus-visible { outline: 2px solid #4f46e5; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>ไม่พบหน้าที่คุณเปิด</h1>
      <p class="lead">
        ลิงก์อาจพิมพ์ผิด หรือหน้านั้นถูกย้ายไปแล้ว เช่น เนื้อหาเรื่องคุกกี้ตอนนี้อยู่รวมใน
        นโยบายความเป็นส่วนตัวแล้ว
      </p>
      <nav>
        <a class="button" href="/">กลับไปหน้าตรวจเอกสาร</a>
        <a class="button secondary" href="/privacy">นโยบายความเป็นส่วนตัว</a>
        <a class="button secondary" href="/terms">ข้อกำหนดการใช้งาน</a>
      </nav>
    </main>
  </body>
</html>
